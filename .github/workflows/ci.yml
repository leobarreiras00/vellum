name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos, formatação, testes unitários e auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # Dependências de produção: falha com vulnerabilidades altas ou críticas.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Build, testes HTTP de segurança e E2E (Playwright, ficheiro JSON)
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Testes HTTP de segurança (cabeçalhos, CSP, rotas privadas) sobre o build
        run: |
          # Porta própria (3101) e `node` direto: `npx` não propaga o sinal ao `next`, que ficava
          # vivo e ocupava a porta 3100 que o Playwright (E2E) exige livre.
          export AUTH_SECRET="$(openssl rand -base64 48)"
          export VELLUM_DATA_FILE="$RUNNER_TEMP/http-tests.json"
          export APP_URL=http://127.0.0.1:3101
          node node_modules/next/dist/bin/next start -p 3101 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true; wait $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3101/api/health >/dev/null && break; sleep 1; done
          VELLUM_TEST_URL=http://127.0.0.1:3101 npm run test:http
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  e2e-postgres:
    name: PostgreSQL (repositório, integridade e E2E)
    runs-on: ubuntu-latest
    needs: qualidade
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vellum
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: vellum_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vellum -d vellum_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://vellum:ci-only-postgres@localhost:5432/vellum_e2e
      DATABASE_URL: postgresql://vellum:ci-only-postgres@localhost:5432/vellum_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # O repositório sobre PostgreSQL cumpre as mesmas regras (RBAC, isolamento, partilha) que sobre JSON.
      - name: Preparar a base (migrações + limpeza)
        run: node scripts/e2e-reset-db.mjs
      - run: npm run test:pg
      # Depois da suite não pode haver linhas órfãs (o esquema não tem FKs entre as tabelas do atelier).
      - run: node scripts/check-integrity.mjs
      - run: npm run test:e2e:pg
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-postgres
          path: test-results/
          retention-days: 7
